name: Template checks
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-24.04
    env:
      GOWORK: 'off'
      VITE_RELEASE_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.4'
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
      - name: Check release notes
        run: |
          python3 -m unittest discover -s scripts -p 'test_release*.py'
          python3 scripts/release_notes.py "$(cat VERSION)" "$RUNNER_TEMP/notes.md"
      - name: Test and build the web console
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun run lint
          bun run test
          bun run build
      - name: Test and build the application
        run: |
          go vet -mod=readonly ./...
          go test -mod=readonly ./...
          go build -mod=readonly ./...
          version=v0.0.0
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then version="$GITHUB_REF_NAME"; fi
          go build -mod=readonly -ldflags "-X github.com/Im-oldxu/new-api/common.Version=$version" -o "$RUNNER_TEMP/admin-server" .
          test "$(env -u VERSION "$RUNNER_TEMP/admin-server" --version)" = "$version"

  independent-modules:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        module: [relaykit, tokenkit]
    env:
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@9c091bb21b7c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - working-directory: ${{ matrix.module }}
        run: |
          go vet -mod=readonly ./...
          go test -mod=readonly ./...
          go build -mod=readonly ./...
