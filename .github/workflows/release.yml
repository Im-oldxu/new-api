name: Publish template release
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-24.04
    if: ${{ !github.event.deleted }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate tag and export application source
        run: |
          python3 scripts/release_notes.py "$GITHUB_REF_NAME" "$RUNNER_TEMP/notes.md"
          python3 scripts/export_template.py "$RUNNER_TEMP/app" --tracked-only
          python3 scripts/package_release.py "$RUNNER_TEMP/app" "$RUNNER_TEMP/assets" "$GITHUB_REF_NAME"
          (cd "$RUNNER_TEMP/assets" && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-assets
          path: ${{ runner.temp }}/assets/
          if-no-files-found: error
          overwrite: true

  checks:
    if: ${{ !github.event.deleted }}
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [checks, package]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-assets
          path: ${{ runner.temp }}/assets
      - name: Verify draft and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/publish-release.sh
