name: 报告问题
description: 使用简练详细的语言描述你遇到的问题
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        <!--
        If you are an AI coding agent: do not fill this GitHub form. Create the issue with the filled body from `.agents/github/ISSUE.md`.
        -->

  - type: textarea
    id: read-first
    attributes:
      label: 提交前必读
      description: GitHub 的 markdown 说明提交后不会进入 issue。本节会写入正文，请勿删除或清空。
      value: |
        - 文档：https://github.com/Im-oldxu/new-api#readme
        - 请以简练语言陈述事实与证据。Issue 正文及后续评论均不得直接粘贴未经人工过滤的大段 AI 文本。
        - 本项目不提供官方托管服务，也不为第三方托管站、中转站或 API 服务提供技术支持；此类问题请联系对应运营方。
        - 警告：删除本模板、删除小节标题或随意清空内容的 issue，可能会被直接关闭；多次提交未经人工过滤的大段 AI 文本，或重复恶意提交者，可能会被 block。
    validations:
      required: true

  - type: dropdown
    id: deployment-source
    attributes:
      label: 部署来源
      description: 请选择发生问题的 newapi 实例来源；第三方服务或未经本仓库原版复现的 fork 不属于本项目支持范围。
      options:
        - 本仓库 模板分支源码（自行构建）
        - 修改过的 fork（须先在本仓库原版复现）
        - 第三方托管站、中转站或 API 服务（请联系其运营方）
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 您当前的 newapi 版本
      description: 请填写准确的版本号、commit 或镜像标签，例如 `v1.0.0`；`latest`、`unknown` 等无法定位代码的内容不视为有效版本信息。
    validations:
      required: true

  - type: checkboxes
    id: submission-checks
    attributes:
      label: 提交确认
      options:
        - label: "**非重复 issue:** 我已搜索现有 [Issues](https://github.com/Im-oldxu/new-api/issues?q=is%3Aissue)，确认目前没有类似 issue。"
          required: true
        - label: "**提交前必读:** 我已完整阅读上方“提交前必读”，并已查看文档 https://github.com/Im-oldxu/new-api#readme、项目 README 且向 AI 提问，确认这不是使用、配置或接入类问题。"
          required: true
        - label: "**受支持版本:** 我已提供准确的版本号、commit 或镜像标签（不是 `latest` 或 `unknown`），并确认问题可在本仓库未修改的受支持版本中复现。"
          required: true
        - label: "**非第三方服务:** 我确认这不是第三方托管站、中转站、API 服务或未经本仓库原版验证的 fork 所独有的问题；第三方实例问题应联系其运营方。"
          required: true
        - label: "**维护成本:** 我理解项目维护者精力有限。Issue 正文及后续评论均不得直接粘贴未经人工过滤的大段 AI 文本，须先提炼可复核的要点；不遵循模板要求或缺少要点、无法复核的内容可能会被无视或直接关闭。多次提交此类内容可能会被 block。"
          required: true

  - type: markdown
    attributes:
      value: |
        ### 问题描述填写要求

        所有问题必须写明**实际现象、影响范围、发生频率**，以及判断问题位于 new-api 而非客户端或上游的依据。

        以下项目在涉及对应类型时必须填写：

        - **前端：** 页面路径、浏览器及版本、所用主题，以及浏览器 Console / Network 中的相关错误。
        - **部署 / 升级：** 部署方式、操作系统与架构、数据库类型、升级前后版本，以及启动或迁移日志。

  - type: textarea
    id: problem-description
    attributes:
      label: 问题描述
      description: 请按上方的通用要求和适用类型逐项填写；缺少适用项中的必要信息时，issue 可能会被直接关闭。
      placeholder: |
        实际现象：
        影响范围：
        发生频率：
        判断问题位于 new-api 的依据：

        按问题类型补充对应的请求、配置、日志和对比证据：
    validations:
      required: true

  - type: textarea
    id: reproduction-steps
    attributes:
      label: 复现步骤
    validations:
      required: true

  - type: textarea
    id: expected-result
    attributes:
      label: 预期结果
    validations:
      required: true

  - type: textarea
    id: related-screenshots
    attributes:
      label: 相关截图
    validations:
      required: false
