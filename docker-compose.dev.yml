# Frontend Development - Backend built from local source
#
# Usage:
#   1. docker compose -f docker-compose.dev.yml up -d
#   2. In web/, run bun install --frozen-lockfile and bun run dev --host 127.0.0.1 --port 5173
#   3. Open http://localhost:5173 (Rsbuild dev server, API auto-proxied to :3000)
#
# Rebuild backend after Go code changes:
#   docker compose -f docker-compose.dev.yml up -d --build new-api
#
# Stop:
#   docker compose -f docker-compose.dev.yml down
#
# Reset data:
#   docker compose -f docker-compose.dev.yml down -v

services:
  new-api:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
        APP_VERSION: ${APP_VERSION:-}
    pull_policy: build
    image: new-api-admin:dev
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ADMIN_HTTP_PORT:-3000}:3000"
    volumes:
      - dev_data:/data
    environment:
      - SQL_DSN=postgresql://root:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/new-api
      - REDIS_CONN_STRING=redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@redis:6379
      - SESSION_SECRET=${SESSION_SECRET:?Set SESSION_SECRET in .env}
      - CRYPTO_SECRET=${CRYPTO_SECRET:?Set CRYPTO_SECRET in .env}
      - TZ=Asia/Shanghai
      # Local HTTP dev mode: keep Secure=false and leave TRUSTED_URL unset. This disables the refresh/logout OriginGuard so the :5173 -> :3000 dev proxy works.
      - SESSION_COOKIE_SECURE=false
      # For HTTPS only: set Secure=true and list every exact trusted HTTPS browser Origin.
      # - SESSION_COOKIE_SECURE=true
      # - SESSION_COOKIE_TRUSTED_URL=https://example.com,https://admin.example.com
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    networks:
      - dev-network

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}"]
    restart: unless-stopped
    networks:
      - dev-network

  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: new-api
    volumes:
      - dev_pg_data:/var/lib/postgresql/data
    networks:
      - dev-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d new-api"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  dev_data:
  dev_pg_data:

networks:
  dev-network:
    driver: bridge
