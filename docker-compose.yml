services:
  new-api:
    build:
      context: .
      args:
        VITE_RELEASE_REPOSITORY: ${VITE_RELEASE_REPOSITORY-Im-oldxu/new-api}
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
        APP_VERSION: ${APP_VERSION:-}
    image: new-api-admin:local
    pull_policy: build
    restart: unless-stopped
    command: ["--log-dir", "/app/logs"]
    ports:
      - "127.0.0.1:${ADMIN_HTTP_PORT:-3000}:3000"
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    environment:
      SQL_DSN: "postgresql://root:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/new-api"
      REDIS_CONN_STRING: "redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@redis:6379"
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      CRYPTO_SECRET: ${CRYPTO_SECRET:?Set CRYPTO_SECRET in .env}
      TZ: ${TZ:-Asia/Shanghai}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks: [new-api-network]
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -qO- http://127.0.0.1:3000/api/status | grep -q '"success":true'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: new-api
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "root", "-d", "new-api"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [new-api-network]

  redis:
    image: redis:latest
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}"]
    networks: [new-api-network]

volumes:
  pg_data:

networks:
  new-api-network:
    driver: bridge
